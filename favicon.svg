<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Didaxis Lab">
  <title>Didaxis Lab</title>
  <!-- Fondo transparente: la pestaña conserva su propio color.
       En tema oscuro la X pasa a un tono claro para no desaparecer. -->
  <style>
    .barra { stroke: #1B2A5A; }
    @media (prefers-color-scheme: dark) { .barra { stroke: #EAF4FA; } }
  </style>
  <line class="barra" x1="22" y1="22" x2="78" y2="78" stroke-width="14" stroke-linecap="round"/>
  <line class="barra" x1="78" y1="22" x2="22" y2="78" stroke-width="14" stroke-linecap="round"/>
  <circle cx="18" cy="18" r="16" fill="#0BC0D8"/>
  <circle cx="82" cy="18" r="16" fill="#0BC0D8"/>
  <circle cx="82" cy="82" r="16" fill="#0BC0D8"/>
  <circle cx="18" cy="82" r="16" fill="#0BC0D8"/>
</svg>
