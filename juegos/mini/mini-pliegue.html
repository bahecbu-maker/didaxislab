<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El último pliegue — vista en miniatura</title>
<style>
  /* Ocupa por completo el contenedor donde se inserte (portal o iframe). */
  html,body{margin:0;height:100%;background:#081e20;overflow:hidden}
  #mini{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="mini" aria-label="Desarrollo plano plegándose en un cubo para encender un farol junto a un zorro de papel"></canvas>
<script>
/* ═══════════════════════════════════════════════════════════════════════
   EL ÚLTIMO PLIEGUE — miniatura en bucle
   Desarrollo plano de un cubo que se pliega en 3D por sus bisagras
   (0° → 90°): primero las cuatro caras laterales, luego la tapa final.
   Al cerrarse el poliedro, el farol se enciende frente al zorro de papel.
   ═══════════════════════════════════════════════════════════════════════ */
const W = 960, H = 600;                      // lienzo virtual 16:10
const cv = document.getElementById('mini');
const ctx = cv.getContext('2d');
const lento = matchMedia('(prefers-reduced-motion: reduce)').matches;

function ajustar(){
  const d = Math.min(2, devicePixelRatio || 1);
  const r = cv.getBoundingClientRect();
  cv.width  = Math.max(1, Math.round(r.width  * d));
  cv.height = Math.max(1, Math.round(r.height * d));
  const e = Math.max(r.width / W, r.height / H) * d;
  ctx.setTransform(e, 0, 0, e, (cv.width - W*e)/2, (cv.height - H*e)/2);
}
addEventListener('resize', ajustar);

/* ── Utilidades ────────────────────────────────────────────────────── */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = u => {
  u = clamp(u, 0, 1);
  return u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u + 2, 2)/2;
};
const rr = (x, y, w, h, r) => {
  r = Math.max(0, Math.min(r, w/2, h/2));
  ctx.beginPath();
  ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r); ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h); ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r); ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y); ctx.closePath();
};

/* ── Ambiente nocturno (destellos dorados y siluetas de bosque) ────── */
const GLINTS = Array.from({ length: 24 }, (_, i) => ({
  x: ((i * 97.3 + 41) % (W - 60)) + 30,
  y: ((i * 61.7 + 28) % (H - 80)) + 30,
  r: 1.5 + (i % 3) * 0.9,
  p: i * 1.13,
  s: 0.7 + (i % 4) * 0.28
}));

/* ── Proyección 3D del desarrollo plano del cubo ───────────────────── */
const YAW = -0.58, PITCH = 0.56;
const CYAW = Math.cos(YAW), SYAW = Math.sin(YAW);
const CPIT = Math.cos(PITCH), SPIT = Math.sin(PITCH);
const CX = 392, CY = 368, SC = 114;

function proj(x, y, z){
  const rx = x * CYAW - y * SYAW;
  const ry = x * SYAW + y * CYAW;
  const py = ry * SPIT - z * CPIT;
  const pz = ry * CPIT + z * SPIT;
  const k = 10 / (10 - pz * 0.42);
  return { x: CX + rx * SC * k, y: CY + py * SC * k, z: pz };
}

function normal3D(pts){
  const a = pts[0], b = pts[1], c = pts[3];
  const ux = b[0]-a[0], uy = b[1]-a[1], uz = b[2]-a[2];
  const vx = c[0]-a[0], vy = c[1]-a[1], vz = c[2]-a[2];
  const nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
  const l = Math.hypot(nx, ny, nz) || 1;
  return [nx/l, ny/l, nz/l];
}

function carasCubo(a1, a2, a3, a4, a5){
  // F0: base fija en Z = 0
  const F0 = [[-.5,-.5,0], [.5,-.5,0], [.5,.5,0], [-.5,.5,0]];
  // F1: izquierda (bisagra x = -0.5)
  const c1 = Math.cos(a1), s1 = Math.sin(a1);
  const F1 = [[-.5,-.5,0], [-.5,.5,0], [-.5-c1,.5,s1], [-.5-c1,-.5,s1]];
  // F2: derecha (bisagra x = 0.5)
  const c2 = Math.cos(a2), s2 = Math.sin(a2);
  const F2 = [[.5,-.5,0], [.5+c2,-.5,s2], [.5+c2,.5,s2], [.5,.5,0]];
  // F3: trasera (bisagra y = -0.5)
  const c3 = Math.cos(a3), s3 = Math.sin(a3);
  const yh = -.5 - c3, zh = s3;
  const F3 = [[-.5,-.5,0], [.5,-.5,0], [.5,yh,zh], [-.5,yh,zh]];
  // F4: delantera (bisagra y = 0.5)
  const c4 = Math.cos(a4), s4 = Math.sin(a4);
  const F4 = [[-.5,.5,0], [.5,.5,0], [.5,.5+c4,s4], [-.5,.5+c4,s4]];
  // F5: tapa superior acoplada al borde exterior de F3
  const c5 = Math.cos(a3 + a5), s5 = Math.sin(a3 + a5);
  const F5 = [[-.5,yh,zh], [.5,yh,zh], [.5,yh-c5,zh+s5], [-.5,yh-c5,zh+s5]];

  return [
    { id:0, pts:F0 }, { id:1, pts:F1 }, { id:2, pts:F2 },
    { id:3, pts:F3 }, { id:4, pts:F4 }, { id:5, pts:F5, esTapa:true }
  ];
}

/* ── Línea de tiempo del bucle (7.4 s sin cortes) ──────────────────── */
const CICLO = 7.4;
// Arranca a medio pliegue para que el primer fotograma nunca parezca quieto
let tCiclo = 1.65, reloj = 1.65;
let chispas = [], onda = null, ultimoBloqueo = false;

function estadoPliegue(t){
  const H90 = Math.PI / 2;
  let u1=0, u2=0, u3=0, u4=0, u5=0, fase='reposo', luz=0, chispaU=-1;

  if(t < 0.75){
    fase = 'plano';
  } else if(t < 2.55){
    // Pliegue escalonado de las 4 caras laterales
    fase = 'paredes';
    u1 = ease((t - 0.75) / 1.25);
    u3 = ease((t - 0.92) / 1.25);
    u2 = ease((t - 1.08) / 1.25);
    u4 = ease((t - 1.24) / 1.25);
  } else if(t < 3.75){
    // El último pliegue: cierra la tapa superior
    fase = 'tapa';
    u1 = u2 = u3 = u4 = 1;
    u5 = ease((t - 2.60) / 1.05);
  } else if(t < 5.75){
    // Cubo cerrado + chispa hacia el farol + resplandor cálido
    fase = 'encendido';
    u1 = u2 = u3 = u4 = u5 = 1;
    chispaU = clamp((t - 3.75) / 0.55, 0, 1);
    luz = ease((t - 4.05) / 0.48);
  } else if(t < 6.95){
    // Despliegue limpio de vuelta al plano
    fase = 'despliegue';
    const dTapa = 1 - ease((t - 5.75) / 0.55);
    const dPar  = 1 - ease((t - 6.08) / 0.80);
    u5 = dTapa;
    u1 = u2 = u3 = u4 = dPar;
    luz = 1 - ease((t - 5.75) / 0.50);
  } else {
    fase = 'plano';
  }

  return {
    a1: u1*H90, a2: u2*H90, a3: u3*H90, a4: u4*H90, a5: u5*H90,
    angDeg: Math.round((fase === 'tapa' ? u5 : (u1+u2+u3+u4+u5)/5) * 90),
    fase, luz, chispaU
  };
}

function lanzarDestellos(x, y, n, color){
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = 35 + Math.random()*115;
    chispas.push({
      x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 18,
      r:2 + Math.random()*3.2, life:0.75 + Math.random()*0.45, max:1.2, color
    });
  }
}

function actualizar(dt){
  reloj += dt;
  const prev = tCiclo;
  tCiclo = (tCiclo + dt) % CICLO;
  if(tCiclo < prev) ultimoBloqueo = false;

  const st = estadoPliegue(tCiclo);
  if(st.fase === 'encendido' && !ultimoBloqueo){
    ultimoBloqueo = true;
    const topC = proj(0, 0, 1);
    onda = { x: topC.x, y: topC.y, life: 0.85, max: 0.85 };
    lanzarDestellos(topC.x, topC.y, 18, '#ffd483');
    lanzarDestellos(796, 250, 14, '#ffcb80');
  }

  if(onda){
    onda.life -= dt;
    if(onda.life <= 0) onda = null;
  }
  for(let i=chispas.length-1; i>=0; i--){
    const c = chispas[i];
    c.x += c.vx * dt; c.y += c.vy * dt;
    c.vx *= 0.96; c.vy *= 0.96;
    c.life -= dt;
    if(c.life <= 0) chispas.splice(i, 1);
  }
}

/* ── Dibujo del fondo nocturno y colinas de papel ──────────────────── */
function dibujarFondo(luz){
  const g = ctx.createRadialGradient(W*0.44, H*0.36, 30, W*0.5, H*0.5, W*0.86);
  g.addColorStop(0, '#1c3e3f');
  g.addColorStop(0.54, '#0f2a2c');
  g.addColorStop(1, '#07191b');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // Siluetas de colinas en capas de papel recortado
  ctx.fillStyle = '#0c2325';
  ctx.beginPath();
  ctx.moveTo(0, 445); ctx.lineTo(155, 392); ctx.lineTo(310, 428);
  ctx.lineTo(520, 368); ctx.lineTo(710, 412); ctx.lineTo(860, 355);
  ctx.lineTo(W, 385); ctx.lineTo(W, H); ctx.lineTo(0, H);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#122f31';
  ctx.beginPath();
  ctx.moveTo(0, 495); ctx.lineTo(190, 456); ctx.lineTo(430, 488);
  ctx.lineTo(665, 442); ctx.lineTo(W, 472); ctx.lineTo(W, H); ctx.lineTo(0, H);
  ctx.closePath(); ctx.fill();

  // Sutil cuadrícula de mesa de plegado bajo el desarrollo plano
  ctx.save();
  ctx.strokeStyle = 'rgba(191,207,197,0.09)';
  ctx.lineWidth = 1.2;
  for(let gx=-2; gx<=2; gx++){
    const a = proj(gx, -2.5, 0), b = proj(gx, 1.7, 0);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  for(let gy=-2; gy<=1; gy++){
    const a = proj(-2, gy, 0), b = proj(2, gy, 0);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  ctx.restore();

  // Reflejo cálido del farol sobre el fondo
  if(luz > 0.01){
    const lg = ctx.createRadialGradient(796, 250, 12, 796, 250, 340);
    lg.addColorStop(0, `rgba(255, 208, 118, ${(0.34*luz).toFixed(3)})`);
    lg.addColorStop(0.5, `rgba(255, 178, 84, ${(0.12*luz).toFixed(3)})`);
    lg.addColorStop(1, 'rgba(255, 178, 84, 0)');
    ctx.fillStyle = lg;
    ctx.fillRect(0, 0, W, H);
  }

  // Destellos flotantes (.glint)
  for(const gl of GLINTS){
    const dy = Math.sin(reloj*gl.s + gl.p) * 10;
    const dx = Math.cos(reloj*gl.s*0.7 + gl.p) * 5;
    const a = 0.22 + 0.55 * (0.5 + 0.5*Math.sin(reloj*1.4*gl.s + gl.p));
    ctx.save();
    ctx.globalAlpha = a * (0.7 + 0.3*luz);
    ctx.shadowBlur = 10; ctx.shadowColor = '#ffc161';
    ctx.fillStyle = '#ffda85';
    ctx.beginPath(); ctx.arc(gl.x + dx, gl.y + dy, gl.r, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

/* ── Farol colgante (derecha) ──────────────────────────────────────── */
function dibujarFarol(luz){
  const lx = 796, ly = 250;
  ctx.save();

  // Rama / soporte curvo desde el borde derecho
  ctx.strokeStyle = '#334e4f';
  ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(W + 10, 154);
  ctx.quadraticCurveTo(860, 148, lx, 186);
  ctx.stroke();
  ctx.strokeStyle = '#587068';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(W + 10, 152);
  ctx.quadraticCurveTo(860, 146, lx, 184);
  ctx.stroke();

  // Balanceo mínimo del farol
  const sway = Math.sin(reloj * 1.4) * 0.035;
  ctx.translate(lx, 186);
  ctx.rotate(sway);

  // Cordel
  ctx.strokeStyle = '#8fa39b'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, 26); ctx.stroke();

  // Halo al encenderse
  const glow = 0.14 + 0.86 * luz;
  const hg = ctx.createRadialGradient(0, 64, 6, 0, 64, 96 + 44*luz);
  hg.addColorStop(0, `rgba(255, 232, 165, ${(0.72*glow).toFixed(3)})`);
  hg.addColorStop(0.45, `rgba(255, 184, 82, ${(0.34*glow).toFixed(3)})`);
  hg.addColorStop(1, 'rgba(255, 184, 82, 0)');
  ctx.fillStyle = hg;
  ctx.beginPath(); ctx.arc(0, 64, 140, 0, Math.PI*2); ctx.fill();

  // Techo de papel plegado del farol
  ctx.fillStyle = '#183536'; ctx.strokeStyle = '#75857e'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(0, 24); ctx.lineTo(34, 42); ctx.lineTo(-34, 42); ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Cuerpo de papel traslúcido
  const cg = ctx.createRadialGradient(0, 64, 4, 0, 64, 38);
  cg.addColorStop(0, luz > 0.1 ? '#fff7dc' : '#4a6868');
  cg.addColorStop(0.55, luz > 0.1 ? '#ffcb74' : '#254344');
  cg.addColorStop(1, luz > 0.1 ? '#d98936' : '#162f31');
  ctx.fillStyle = cg;
  ctx.strokeStyle = luz > 0.2 ? '#ffe3af' : '#657d79';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-24, 42); ctx.lineTo(24, 42); ctx.lineTo(19, 88); ctx.lineTo(-19, 88);
  ctx.closePath(); ctx.fill(); ctx.stroke();

  // Varillas del farol
  ctx.strokeStyle = 'rgba(12,34,36,0.55)'; ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-8, 42); ctx.lineTo(-6, 88);
  ctx.moveTo( 8, 42); ctx.lineTo( 6, 88);
  ctx.stroke();

  // Base y borla
  ctx.fillStyle = '#183536';
  rr(-22, 88, 44, 8, 4); ctx.fill(); ctx.strokeStyle = '#75857e'; ctx.stroke();
  ctx.strokeStyle = '#ffcb80'; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.moveTo(0, 96); ctx.lineTo(0, 114); ctx.stroke();

  ctx.restore();
}

/* ── Zorro de papel (origami facetado, mirando al cubo) ────────────── */
function dibujarZorro(luz){
  const fx = 768, fy = 468;
  const resp = Math.sin(reloj * 2.2) * 1.6;

  ctx.save();
  ctx.translate(fx, fy);

  // Peaña / roca facetada de papel
  ctx.fillStyle = '#0e282a';
  ctx.beginPath();
  ctx.moveTo(-98, 22); ctx.lineTo(-42, -6); ctx.lineTo(54, -8);
  ctx.lineTo(106, 20); ctx.lineTo(86, 56); ctx.lineTo(-88, 56);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = 'rgba(133,148,132,0.45)'; ctx.lineWidth = 1.6; ctx.stroke();

  // Sombra bajo el zorro
  ctx.fillStyle = 'rgba(4,14,16,0.46)';
  ctx.beginPath(); ctx.ellipse(4, 10, 56, 12, 0, 0, Math.PI*2); ctx.fill();

  ctx.translate(0, resp);
  const faceta = (pts, col) => {
    ctx.beginPath();
    pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.closePath();
    ctx.fillStyle = col; ctx.fill();
    ctx.strokeStyle = 'rgba(255,244,220,0.22)'; ctx.lineWidth = 1.2; ctx.stroke();
  };

  // Cola plegada (detrás, a la derecha)
  faceta([[26, 6], [74, -20], [54, 12]], '#cf6125');
  faceta([[74, -20], [92, -46], [56, -24]], '#e7823a');
  faceta([[92, -46], [102, -62], [74, -44]], '#faf0db');   // punta blanca

  // Cuerpo de origami
  faceta([[-26, 10], [28, 10], [18, -46], [-18, -36]], '#d96b2b');
  faceta([[-26, 10], [8, 10], [-14, -40]], '#f0944c');     // flanco iluminado
  faceta([[-24, 10], [-6, 10], [-18, -32]], '#f9eed9');    // pecho crema

  // Cabeza inclinada con curiosidad hacia el cubo (izquierda)
  const tilt = -0.05 + luz * 0.08;
  ctx.save();
  ctx.translate(-14, -50);
  ctx.rotate(tilt);

  // Oreja trasera y delantera
  faceta([[2, -22], [18, -56], [24, -18]], '#b8501d');
  faceta([[-10, -24], [-2, -60], [10, -22]], '#e67d37');
  faceta([[-4, -26], [0, -48], [6, -24]], '#ffdfb0');

  // Rostro geométrico
  faceta([[-44, 4], [-10, -24], [24, -18], [16, 10]], '#ea863e');
  faceta([[-44, 4], [-10, -24], [-12, 8]], '#f5a55d');
  faceta([[-44, 4], [-12, 8], [14, 12], [-20, 14]], '#faf0db');  // mejilla blanca

  // Hocico y ojo atento
  ctx.fillStyle = '#132124';
  ctx.beginPath(); ctx.arc(-44, 4, 4.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(-13, -6, 3.2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff8e6';
  ctx.beginPath(); ctx.arc(-14, -7.2, 1.1, 0, Math.PI*2); ctx.fill();

  // Brillo cálido del farol sobre el zorro
  if(luz > 0.05){
    ctx.globalAlpha = 0.22 * luz;
    faceta([[-44, 4], [-10, -24], [24, -18], [16, 10]], '#ffe3af');
  }
  ctx.restore();
  ctx.restore();
}

/* ── Dibujo del desarrollo plano / cubo 3D ─────────────────────────── */
function colorPapel(n, luz){
  // Tres tonalidades limpias según orientación (arriba, lateral, frente)
  const lum = 0.72*Math.abs(n[2]) + 0.50*Math.abs(n[0]) + 0.34*Math.abs(n[1]);
  const t = clamp((lum - 0.34) / 0.38, 0, 1);
  const r = Math.round(202 + 49*t + 4*luz);
  const g = Math.round(176 + 61*t + 6*luz);
  const b = Math.round(134 + 78*t - 10*luz);
  return `rgb(${clamp(r,0,255)},${clamp(g,0,255)},${clamp(b,0,255)})`;
}

function dibujarPoliedro(st){
  const caras = carasCubo(st.a1, st.a2, st.a3, st.a4, st.a5);

  // Sombra proyectada sobre el tablero
  ctx.save();
  ctx.fillStyle = 'rgba(4,16,18,0.42)';
  const s0 = proj(-0.55, -0.55, 0), s1 = proj(0.65, -0.55, 0),
        s2 = proj(0.65, 0.65, 0),   s3 = proj(-0.55, 0.65, 0);
  ctx.beginPath();
  ctx.moveTo(s0.x, s0.y+8); ctx.lineTo(s1.x, s1.y+8);
  ctx.lineTo(s2.x, s2.y+8); ctx.lineTo(s3.x, s3.y+8);
  ctx.closePath(); ctx.fill();
  ctx.restore();

  // Ordenación por profundidad media (algoritmo del pintor)
  const orden = caras.map(c => {
    const p2 = c.pts.map(v => proj(v[0], v[1], v[2]));
    const zMed = (p2[0].z + p2[1].z + p2[2].z + p2[3].z) * 0.25;
    return { c, p2, zMed, n: normal3D(c.pts) };
  }).sort((a, b) => a.zMed - b.zMed);

  for(const item of orden){
    const { c, p2, n } = item;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(p2[0].x, p2[0].y);
    ctx.lineTo(p2[1].x, p2[1].y);
    ctx.lineTo(p2[2].x, p2[2].y);
    ctx.lineTo(p2[3].x, p2[3].y);
    ctx.closePath();

    ctx.fillStyle = colorPapel(n, st.luz);
    ctx.fill();

    // Tinte dorado suave al encenderse el farol
    if(st.luz > 0.02){
      ctx.fillStyle = `rgba(255, 203, 128, ${(0.18*st.luz).toFixed(3)})`;
      ctx.fill();
    }

    // Borde de cartulina cortada
    ctx.strokeStyle = c.esTapa && st.fase === 'tapa' ? '#ffa244' : '#586c66';
    ctx.lineWidth = c.esTapa && st.fase === 'tapa' ? 3 : 2;
    ctx.lineJoin = 'round';
    ctx.stroke();

    // Sello geométrico sutil en la tapa (el último pliegue)
    if(c.esTapa){
      const mx = (p2[0].x + p2[1].x + p2[2].x + p2[3].x) * 0.25;
      const my = (p2[0].y + p2[1].y + p2[2].y + p2[3].y) * 0.25;
      ctx.fillStyle = st.luz > 0.2
        ? `rgba(255, 162, 68, ${(0.55 + 0.45*st.luz).toFixed(2)})`
        : 'rgba(180, 120, 56, 0.35)';
      ctx.beginPath(); ctx.arc(mx, my, 9, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // Bisagras activas con trazo discontinuo naranja (#ffa244)
  const yh = -0.5 - Math.cos(st.a3), zh = Math.sin(st.a3);
  const bisagras = [
    { a:[-.5,-.5,0],  b:[-.5,.5,0],  act: st.fase === 'paredes' || st.fase === 'plano' },
    { a:[ .5,-.5,0],  b:[ .5,.5,0],  act: st.fase === 'paredes' },
    { a:[-.5,-.5,0],  b:[ .5,-.5,0], act: st.fase === 'paredes' },
    { a:[-.5, .5,0],  b:[ .5, .5,0], act: st.fase === 'paredes' || st.fase === 'plano' },
    { a:[-.5, yh,zh], b:[ .5, yh,zh], act: st.fase === 'tapa' || st.fase === 'plano' }
  ];

  ctx.save();
  ctx.lineCap = 'round';
  for(const h of bisagras){
    if(!h.act) continue;
    const pA = proj(h.a[0], h.a[1], h.a[2]);
    const pB = proj(h.b[0], h.b[1], h.b[2]);
    ctx.strokeStyle = '#ffa244';
    ctx.lineWidth = st.fase === 'tapa' ? 4.2 : 3.2;
    ctx.setLineDash([10, 8]);
    ctx.shadowBlur = 10; ctx.shadowColor = 'rgba(255,162,68,0.85)';
    ctx.beginPath(); ctx.moveTo(pA.x, pA.y); ctx.lineTo(pB.x, pB.y); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();

  // Chispa dorada viajando del cubo cerrado hacia el farol
  if(st.chispaU > 0 && st.chispaU < 1){
    const ini = proj(0, 0, 1);
    const u = ease(st.chispaU);
    const sx = ini.x + (796 - ini.x) * u;
    const sy = ini.y + (250 - ini.y) * u - Math.sin(u * Math.PI) * 90;
    ctx.save();
    ctx.shadowBlur = 22; ctx.shadowColor = '#ffc161';
    ctx.fillStyle = '#fff5d6';
    ctx.beginPath(); ctx.arc(sx, sy, 8*(1 - 0.35*u), 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

/* ── Onda de cierre y chispas ──────────────────────────────────────── */
function dibujarEfectos(){
  ctx.save();
  if(onda){
    const r = onda.life / onda.max;
    ctx.strokeStyle = `rgba(255, 212, 131, ${(r*0.85).toFixed(3)})`;
    ctx.lineWidth = 3.5;
    ctx.beginPath(); ctx.arc(onda.x, onda.y, (1-r)*120 + 18, 0, Math.PI*2); ctx.stroke();
  }
  for(const c of chispas){
    const a = clamp(c.life / c.max, 0, 1);
    ctx.globalAlpha = a;
    ctx.fillStyle = c.color;
    ctx.beginPath(); ctx.arc(c.x, c.y, c.r*(0.4 + 0.6*a), 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

/* ── Medidor superior derecho (estilo #meter del juego) ────────────── */
function dibujarMedidor(st){
  const bx = W - 266, by = 24, bw = 240, bh = 54;
  const listo = st.fase === 'encendido';

  ctx.save();
  rr(bx, by, bw, bh, 27);
  ctx.fillStyle = 'rgba(17, 48, 51, 0.92)'; ctx.fill();
  ctx.strokeStyle = listo ? '#ffd483' : '#859484';
  ctx.lineWidth = 2; ctx.stroke();

  // Punto indicador
  ctx.fillStyle = listo ? '#ffd483' : '#ffa244';
  ctx.shadowBlur = listo ? 12 : 0; ctx.shadowColor = '#ffc161';
  ctx.beginPath(); ctx.arc(bx + 26, by + bh/2, 6, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  ctx.font = '800 13px system-ui, sans-serif';
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#c9d5c9';
  ctx.fillText(listo ? 'FAROL' : 'PLIEGUE', bx + 44, by + bh/2 + 1);

  ctx.font = '900 28px Georgia, serif';
  ctx.textAlign = 'right';
  ctx.fillStyle = listo ? '#ffe3af' : '#ffedcd';
  ctx.fillText(listo ? '90° ★' : `${st.angDeg}°`, bx + bw - 22, by + bh/2 + 1);
  ctx.restore();
}

function dibujar(){
  const st = estadoPliegue(tCiclo);
  dibujarFondo(st.luz);
  dibujarFarol(st.luz);
  dibujarPoliedro(st);
  dibujarZorro(st.luz);
  dibujarEfectos();
  dibujarMedidor(st);

  // Viñeta suave
  const v = ctx.createRadialGradient(W/2, H*0.48, H*0.44, W/2, H*0.48, W*0.84);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(4,16,18,0.44)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

/* ── Bucle con pausa inteligente para la rejilla de 6 juegos ─────────── */
let activo = true, raf = 0, previo = performance.now();

function bucle(ahora){
  if(!activo){ raf = 0; return; }
  const dt = Math.min(0.05, (ahora - previo)/1000);
  previo = ahora;
  actualizar(dt);
  dibujar();
  raf = requestAnimationFrame(bucle);
}
function reanudar(){
  if(lento || activo) return;
  activo = true;
  previo = performance.now();
  if(!raf) raf = requestAnimationFrame(bucle);
}
function pausar(){
  activo = false;
  if(raf){ cancelAnimationFrame(raf); raf = 0; }
}

addEventListener('message', e => {
  if(e.data && e.data.type === 'didaxis-preview'){
    e.data.active ? reanudar() : pausar();
  }
});
document.addEventListener('visibilitychange', () => {
  document.hidden ? pausar() : reanudar();
});

ajustar();
if(lento){
  tCiclo = 4.6;
  actualizar(0.016);
  dibujar();
} else {
  actualizar(0.016);
  dibujar();
  raf = requestAnimationFrame(bucle);
}
</script>
