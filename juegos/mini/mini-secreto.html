  @keyframes deriva{
    from{transform:scale(1.04) translate(0,0)}
    to{transform:scale(1.12) translate(-1.6%,-1.4%)}
  }
  #velo{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 62% 48% at 50% 38%, rgba(10,6,32,.10) 0%, rgba(10,6,32,.62) 62%, rgba(10,6,32,.90) 100%),
      linear-gradient(180deg, rgba(10,6,32,.72) 0%, rgba(10,6,32,0) 26%, rgba(10,6,32,.86) 78%);
  }
  /* Rejilla holográfica y barrido, del propio lenguaje visual del juego */
  #rejilla{
    position:absolute; inset:0; opacity:.5;
    background-image:linear-gradient(rgba(53,224,240,.14) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(53,224,240,.14) 1px,transparent 1px);
    background-size:38px 38px;
    -webkit-mask-image:radial-gradient(ellipse at 50% 45%,#000 15%,transparent 76%);
    mask-image:radial-gradient(ellipse at 50% 45%,#000 15%,transparent 76%);
  }
  #barrido{
    position:absolute; left:0; right:0; height:150px; pointer-events:none;
    background:linear-gradient(180deg,transparent,rgba(53,224,240,.13),transparent);
    animation:barrer 6.5s linear infinite;
  }
  @keyframes barrer{0%{top:-150px}100%{top:100%}}

  /* Halo palpitante sobre el portal de la ilustración */
  #portal{
    position:absolute; left:50%; top:41%; width:34%; aspect-ratio:1;
    transform:translate(-50%,-50%); border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(123,47,247,.34) 0%, rgba(255,77,157,.16) 42%, transparent 70%);
    filter:blur(14px); animation:latir 4.6s ease-in-out infinite;
  }
  @keyframes latir{
    0%,100%{opacity:.55; transform:translate(-50%,-50%) scale(.94)}
    50%    {opacity:1;   transform:translate(-50%,-50%) scale(1.12)}
  }

  /* ── Capa de deducción ─────────────────────────────────────────── */
  .capa{position:absolute; left:0; right:0; padding:0 clamp(14px,3.2vw,34px)}

  #pista-zona{top:clamp(12px,3.4%,26px); display:flex; justify-content:center}
  #pista{
    display:inline-flex; align-items:center; gap:10px;
    padding:9px 18px; border-radius:999px; max-width:92%;
    background:rgba(10,6,32,.78); border:1px solid rgba(53,224,240,.42);
    box-shadow:0 0 26px rgba(53,224,240,.20);
    color:#EAF6FF; font-size:clamp(12px,2.1vw,17px); font-weight:600;
    letter-spacing:.01em; opacity:0; transform:translateY(-10px);
    transition:opacity .42s, transform .42s;
    backdrop-filter:blur(6px); white-space:nowrap;
  }
  #pista.on{opacity:1; transform:none}
  #pista .ic{
    width:7px; height:7px; border-radius:50%; background:#35E0F0; flex:none;
    box-shadow:0 0 10px 2px rgba(53,224,240,.8);
  }
  #pista b{color:#35E0F0; font-weight:700}

  #tablero{
    bottom:clamp(46px,11%,74px);
    display:grid; grid-template-columns:repeat(10,1fr);
    gap:clamp(3px,.7vw,7px);
  }
  .n{
    aspect-ratio:1; display:flex; align-items:center; justify-content:center;
    border-radius:6px; font-variant-numeric:tabular-nums;
    font-size:clamp(9px,1.55vw,14px); font-weight:700;
    background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.13);
    color:#CFE3F2; transition:all .45s cubic-bezier(.22,1,.36,1);
  }
  .n.vivo{
    background:rgba(53,224,240,.16); border-color:rgba(53,224,240,.55);
    color:#EAFDFF; box-shadow:0 0 12px rgba(53,224,240,.22);
  }
  .n.fuera{opacity:.14; transform:scale(.76); box-shadow:none;
    background:rgba(255,255,255,.03); border-color:rgba(255,255,255,.06)}
  .n.gana{
    background:#FF4D9D; border-color:#FF9AC6; color:#fff;
    transform:scale(1.5); box-shadow:0 0 26px 6px rgba(255,77,157,.55);
    z-index:2;
  }

  #pie{
    bottom:clamp(14px,4%,28px); display:flex; justify-content:center;
    gap:8px; align-items:baseline;
  }
  #pie span{
    font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;
    font-size:clamp(9px,1.5vw,12px); letter-spacing:.16em; text-transform:uppercase;
    color:rgba(210,232,248,.6);
  }
  #cuenta{color:#35E0F0; font-weight:700}

  @media (prefers-reduced-motion:reduce){
    #fondo,#barrido,#portal{animation:none}
    .n,#pista{transition:none}
  }
</style>
</head>
<body>
<div id="mini" aria-label="Las pistas van descartando candidatos hasta dejar un único número">
  <div id="fondo"></div>
  <div id="portal"></div>
  <div id="velo"></div>
  <div id="rejilla"></div>
  <div id="barrido"></div>

  <div class="capa" id="pista-zona">
    <div id="pista"><span class="ic"></span><span id="pista-txt"></span></div>
  </div>

  <div class="capa" id="tablero"></div>

  <div class="capa" id="pie">
    <span>Candidatos</span><span id="cuenta">30</span>
  </div>
</div>

<script>
const lento = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* Cadena real de deducción sobre los números del 1 al 30.
   par → múltiplo de 3 → mayor que 10 → sus cifras suman 6  ⇒  24 */
const PISTAS = [
  { txt:'Mi número es <b>par</b>',                     f:n => n % 2 === 0 },
  { txt:'Es <b>múltiplo de 3</b>',                     f:n => n % 3 === 0 },
  { txt:'Es <b>mayor que 10</b>',                      f:n => n > 10 },
  { txt:'Sus cifras <b>suman 6</b>',                   f:n => String(n).split('').reduce((a,d)=>a+ +d,0) === 6 },
];
const TOTAL = 30;

const tablero = document.getElementById('tablero');
const pista   = document.getElementById('pista');
const pistaTx = document.getElementById('pista-txt');
const cuenta  = document.getElementById('cuenta');
const celdas  = [];

for(let n=1; n<=TOTAL; n++){
  const d = document.createElement('div');
  d.className = 'n'; d.textContent = n;
  tablero.appendChild(d); celdas.push(d);
}

const espera = ms => new Promise(r => setTimeout(r, ms));

async function ronda(){
  // Reinicio: todos los números vuelven a estar en juego
  celdas.forEach(c => c.className = 'n');
  cuenta.textContent = TOTAL;
  pista.classList.remove('on');
  await espera(900);

  let vivos = Array.from({length:TOTAL}, (_,i) => i+1);

  for(const p of PISTAS){
    pistaTx.innerHTML = p.txt;
    pista.classList.add('on');
    await espera(1100);

    const quedan = vivos.filter(p.f);
    // Los descartados se apagan de forma escalonada: se ve el cerco cerrarse
    vivos.filter(n => !p.f(n)).forEach((n, i) => {
      setTimeout(() => celdas[n-1].classList.add('fuera'), i * 34);
    });
    quedan.forEach(n => celdas[n-1].classList.add('vivo'));
    vivos = quedan;

    await espera(560);
    cuenta.textContent = vivos.length;
    await espera(1500);
    pista.classList.remove('on');
    await espera(420);
  }

  // El superviviente
  const g = vivos[0];
  if(g){
    celdas[g-1].classList.remove('vivo');
    celdas[g-1].classList.add('gana');
    pistaTx.innerHTML = 'El número secreto es <b>' + g + '</b>';
    pista.classList.add('on');
  }
  await espera(3200);
  pista.classList.remove('on');
  await espera(800);
}

async function bucle(){
  if(lento){                                  // una sola imagen, sin animación
    pistaTx.innerHTML = PISTAS[0].txt;
    pista.classList.add('on');
    celdas.forEach((c,i) => { if((i+1) % 2) c.classList.add('fuera'); });
    cuenta.textContent = 15;
    return;
  }
  while(true) await ronda();
}
bucle();
</script>
</body>
</html>
